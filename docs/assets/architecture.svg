<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">GigaCode Bridge MCP architecture</title><desc id="desc">An MCP client sends a request over stdio to the server, which launches GigaCode in a temporary Git worktree and returns a patch.</desc>
<rect width="1200" height="440" rx="24" fill="#101923"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="56" y="72" fill="#edf4fa" font-size="34" font-weight="700">GigaCode Bridge MCP</text>
<text x="56" y="112" fill="#aabac8" font-size="19">A small MCP bridge. A patch you can review.</text>
<g fill="#1c2b39" stroke="#405669" stroke-width="2"><rect x="56" y="174" width="260" height="130" rx="16"/><rect x="470" y="174" width="260" height="130" rx="16"/><rect x="884" y="174" width="260" height="130" rx="16"/></g>
<g fill="#edf4fa" font-size="24" font-weight="700" text-anchor="middle"><text x="186" y="228">MCP client</text><text x="600" y="228">MCP server</text><text x="1014" y="228">GigaCode CLI</text></g>
<g fill="#aabac8" font-size="17" text-anchor="middle"><text x="186" y="266">Request + review</text><text x="600" y="266">Validate + collect diff</text><text x="1014" y="266">Temporary worktree</text><text x="393" y="207">stdio</text><text x="807" y="207">spawn</text></g>
<g stroke="#70d8bd" stroke-width="3" fill="none"><path d="M332 241H450l-10-7m10 7-10 7"/><path d="M746 241H864l-10-7m10 7-10 7"/><path d="M1014 320v46H186v-46m0 0-7 10m7-10 7 10"/></g>
<rect x="451" y="346" width="298" height="38" rx="8" fill="#101923"/><text x="600" y="372" text-anchor="middle" fill="#70d8bd" font-size="19">Structured report + patch</text>
</g></svg>
